<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Risk Assessment Dashboard - ISO/IEC 27001:2022</title>
  </head>
  <body>
    <div id="root">
      <!-- Inline loading screen shown before React boots -->
      <div id="initial-loader" style="
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        height:100vh;background:#0f172a;color:#94a3b8;font-family:sans-serif;gap:16px;">
        <svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 24 24' fill='none' stroke='#3b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
          <path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/>
        </svg>
        <div style="font-size:18px;font-weight:600;color:#e2e8f0">Risk Assessment Dashboard</div>
        <div style="width:40px;height:4px;background:#1e293b;border-radius:2px;overflow:hidden">
          <div style="width:100%;height:100%;background:#3b82f6;animation:slide 1s ease-in-out infinite alternate;border-radius:2px"></div>
        </div>
        <style>@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(100%)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
